# PulseReport Configuration
# Sample configuration file for PulseReport
#
# How this file is located:
# 1. Auto-detection (no flags needed): PulseReport checks, in order,
#    ./pulsereport.properties, src/main/resources/pulsereport.properties,
#    and /pulsereport.properties on the classpath.
# 2. Explicit override: pass --config <path> to load a specific file,
#    which takes precedence over auto-detection.

# Output formats (comma-separated)
pulsereport.output.formats=html,json,junit
pulsereport.output.directory=target/pulsereport
# Title shown in the HTML report header and browser tab (default: the test run name)
#pulsereport.report.title=Checkout regression

# S3 Publishing
pulsereport.s3.enabled=false
pulsereport.s3.bucket=my-test-reports
pulsereport.s3.region=us-east-1
pulsereport.s3.keyPrefix=builds/${BUILD_ID}/

# HTTP Publishing
pulsereport.http.enabled=false
pulsereport.http.url=https://api.example.com/reports
pulsereport.http.method=POST
pulsereport.http.auth.type=bearer
pulsereport.http.auth.token=${API_TOKEN}

# Slack Notifications
pulsereport.slack.enabled=false
pulsereport.slack.webhookUrl=${SLACK_WEBHOOK}
pulsereport.slack.channel=#test-results
pulsereport.slack.mentionOnFailure=@qa-team
# URL to include in Slack notification linking to the published report
#pulsereport.slack.reportUrl=https://reports.example.com/latest

# Selenium screenshots: all | failed (default) | last | none
pulsereport.screenshots.mode=failed
# Where screenshots live: embed (default, Base64 inside the report) | path (files in the folder below)
pulsereport.screenshots.storage=embed
# Folder for screenshot files when storage=path (absolute, or relative to the working directory).
# Default: <output directory>/artifacts/screenshots. The report links them by relative path.
#pulsereport.screenshots.directory=/shared/pulsereport/screenshots
# Selenium video: always | failed | none (default). Requires ffmpeg.
pulsereport.video.mode=none
pulsereport.video.fps=2
pulsereport.video.ffmpegPath=ffmpeg
# Selenium video storage: path (default, file in the folder below) | embed (Base64 in the HTML)
#   | url (uploaded with SeleniumAdapter.setVideoUploader, e.g. to MinIO; the report plays the URL)
pulsereport.video.storage=path
# Folder for video files (absolute, or relative to the working directory). Default: <output directory>/videos
#pulsereport.video.directory=/shared/pulsereport/videos

# Selenium step detail: full (default) | minimal (no extra browser calls per action;
# elements are named by their locator)
pulsereport.selenium.stepDetail=full
# Selenium data masking: sensitive (default) | all | none
#   sensitive: typed text is hidden in password, one-time-code and card fields and in fields
#   whose name, id or label looks sensitive (password, token, otp, pin, cvv, ... plus the
#   pulsereport.maskBody.fields names below); credentials and sensitive URL parameters
#   (token, code, access_token, ...) are hidden in URLs.
#   all: every typed text is hidden. pulsereport.maskSensitiveData=false turns masking off.
pulsereport.selenium.maskInputs=sensitive
# Evidence added to failed browser tests: any of page, console, source - or none
pulsereport.selenium.failureCapture=page,console,source
# Record page.load.time and page.ttfb metrics for every navigation (default: true)
pulsereport.selenium.pageMetrics=true
# Record executeScript calls as steps (default: false)
pulsereport.selenium.trackScripts=false

# Artifact Content Configuration
# Maximum size (in bytes) of each captured request/response body (default: 51200 = 50KB)
pulsereport.maxArtifactContentSize=51200
# Master switch: whether to mask sensitive data in artifacts and Selenium steps (default: true)
pulsereport.maskSensitiveData=true
# Whether to mask headers when maskSensitiveData is true (default: true)
pulsereport.maskHeaders.enabled=true
# Comma-separated list of headers to mask when maskSensitiveData is true
pulsereport.maskHeaders.fields=Authorization,X-API-Key,Cookie,Set-Cookie

# Body Masking Configuration
# Whether to mask sensitive data in request/response bodies (default: true)
pulsereport.maskBody.enabled=true
# Comma-separated list of body field names (JSON keys / form fields) to mask.
# The list is authoritative: setting it replaces the built-in defaults.
pulsereport.maskBody.fields=password,secret,token,access_token,refresh_token,id_token,client_secret,api_key,apiKey,authorization
# Whether to also mask Bearer tokens and JWTs in bodies via regex (default: true)
pulsereport.maskBody.maskTokens=true
