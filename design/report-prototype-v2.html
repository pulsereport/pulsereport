<!doctype html>
<html lang="en" data-theme="auto">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>PulseReport</title>
    <script>try { var t = localStorage.getItem('pr-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) { }</script>
    <link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        /* Geist and Geist Mono, SIL Open Font License (fonts/OFL-Geist.txt). The real report inlines these as base64. */
        @font-face {
            font-family: "Geist";
            src: url("fonts/Geist-Variable.woff2") format("woff2");
            font-weight: 100 900;
            font-style: normal;
            font-display: swap
        }

        @font-face {
            font-family: "Geist Mono";
            src: url("fonts/GeistMono-Variable.woff2") format("woff2");
            font-weight: 100 900;
            font-style: normal;
            font-display: swap
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box
        }

        [hidden] {
            display: none !important
        }

        :root {
            --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --font-mono: "Geist Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
            --radius: 6px;
            --surface: #f7f8f9;
            --raised: #fcfcfd;
            --sunken: #eef0f2;
            --selected: #e8ebee;
            --border: #e1e4e8;
            --border-strong: #c9ced3;
            --ink: #212529;
            --ink-muted: #5b636b;
            --accent: #0f8b8d;
            --accent-ink: #0a6c6e;
            --pass: #2b7a3d;
            --fail: #b4413a;
            --skip: #8a5f00;
            --mark-pass: #8b939b;
            --bar-pass: #c9ced3;
            color-scheme: light;
        }

        @media screen {
            :root[data-theme="dark"] {
                --surface: #111315;
                --raised: #16191c;
                --sunken: #0c0e10;
                --selected: #22272c;
                --border: #262b30;
                --border-strong: #363c42;
                --ink: #e7e9eb;
                --ink-muted: #9ba3aa;
                --accent: #2fb3b5;
                --accent-ink: #5cc8ca;
                --pass: #5bbf73;
                --fail: #e8807a;
                --skip: #d9a44a;
                --mark-pass: #6b737a;
                --bar-pass: #363c42;
                color-scheme: dark;
            }
        }

        @media screen and (prefers-color-scheme:dark) {
            :root[data-theme="auto"] {
                --surface: #111315;
                --raised: #16191c;
                --sunken: #0c0e10;
                --selected: #22272c;
                --border: #262b30;
                --border-strong: #363c42;
                --ink: #e7e9eb;
                --ink-muted: #9ba3aa;
                --accent: #2fb3b5;
                --accent-ink: #5cc8ca;
                --pass: #5bbf73;
                --fail: #e8807a;
                --skip: #d9a44a;
                --mark-pass: #6b737a;
                --bar-pass: #363c42;
                color-scheme: dark;
            }
        }

        html,
        body {
            margin: 0
        }

        body {
            font: 13px/1.5 var(--font-sans);
            color: var(--ink);
            background: var(--surface);
            font-variant-numeric: tabular-nums;
            -webkit-font-smoothing: antialiased
        }

        button {
            font: inherit;
            color: inherit
        }

        code,
        pre,
        kbd,
        .mono {
            font-family: var(--font-mono)
        }

        .muted {
            color: var(--ink-muted)
        }

        :focus-visible {
            outline: 2px solid var(--accent-ink);
            outline-offset: 2px;
            border-radius: var(--radius)
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0
        }

        /* Status marks, drawn from the logo: dot = passed, upright bar = failed, flat bar = skipped */
        .mark {
            display: inline-block;
            flex: none;
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--mark-pass)
        }

        .mark[data-s="fail"] {
            width: 4px;
            height: 14px;
            background: var(--fail)
        }

        .mark[data-s="skip"] {
            width: 10px;
            height: 4px;
            background: var(--skip)
        }

        .mark.lg {
            width: 8px;
            height: 8px
        }

        .mark.lg[data-s="fail"] {
            width: 5px;
            height: 20px
        }

        .mark.lg[data-s="skip"] {
            width: 14px;
            height: 5px
        }

        .mcell {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 19.5px;
            flex: none
        }

        .s-pass {
            color: var(--pass)
        }

        .s-fail {
            color: var(--fail)
        }

        .app {
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            height: 100dvh
        }

        /* Top bar */
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            height: 48px;
            padding: 0 24px;
            background: var(--raised);
            border-bottom: 1px solid var(--border)
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0
        }

        .brand-mark {
            width: 20px;
            height: 20px;
            flex: none
        }

        .bm-ink {
            fill: var(--ink)
        }

        .bm-accent {
            fill: var(--accent)
        }

        .run-name {
            margin: 0;
            overflow: hidden;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            text-overflow: ellipsis
        }

        .actions {
            display: flex;
            gap: 4px;
            margin-left: auto
        }

        .icon-btn {
            display: inline-grid;
            place-items: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: var(--radius);
            background: transparent;
            color: var(--ink-muted);
            cursor: pointer
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor
        }

        .icon-btn:hover {
            background: var(--sunken);
            color: var(--ink)
        }

        .icon-btn:active {
            transform: translateY(1px)
        }

        .btn {
            display: inline-flex;
            align-items: center;
            height: 32px;
            padding: 0 12px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            background: var(--raised);
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer
        }

        .btn:hover {
            background: var(--sunken)
        }

        /* Verdict band */
        .verdict {
            display: grid;
            grid-template-columns: minmax(240px, max-content) minmax(0, 1fr);
            gap: 48px;
            align-items: end;
            padding: 24px 24px 20px;
            border-bottom: 1px solid var(--border)
        }

        .verdict-title {
            margin: 0;
            font-size: 40px;
            line-height: 1.05;
            font-weight: 600;
            letter-spacing: -.03em
        }

        .verdict-title .n-fail {
            color: var(--fail)
        }

        .verdict-sub {
            margin: 4px 0 0;
            font-size: 15px;
            color: var(--ink-muted)
        }

        .run-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 20px;
            margin-top: 12px;
            font-size: 12px
        }

        .run-meta .k {
            color: var(--ink-muted)
        }

        .run-meta .v {
            margin-left: 6px
        }

        .pulse {
            width: 100%;
            min-width: 0;
            margin-left: auto
        }

        .pulse-scroll {
            overflow-x: auto;
            padding-bottom: 16px;
            scrollbar-width: thin
        }

        .pulse-track {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: var(--bar-gap, 2px);
            min-width: min-content;
            height: 56px;
            border-bottom: 1px solid var(--border-strong)
        }

        .bar {
            position: relative;
            flex: 0 1 6px;
            min-width: 2px;
            border-radius: 999px;
            background: var(--bar-pass);
            cursor: pointer
        }

        .bar[data-s="fail"] {
            background: var(--fail)
        }

        .bar[data-s="skip"] {
            background: var(--skip)
        }

        .bar[aria-current="true"]::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -13px;
            width: 8px;
            height: 8px;
            margin-left: -4px;
            border-radius: 50%;
            background: var(--accent)
        }

        .pulse-track:hover .bar {
            opacity: .45
        }

        .pulse-track .bar:hover,
        .pulse-track .bar[aria-current="true"] {
            opacity: 1
        }

        .pulse-axis {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            font-size: 11px;
            color: var(--ink-muted)
        }

        .legend {
            display: flex;
            gap: 16px
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px
        }

        /* Panes */
        .panes {
            display: grid;
            grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
            min-height: 0
        }

        .app.is-empty .panes {
            grid-template-columns: 1fr
        }

        .app.is-empty .list-pane {
            display: none
        }

        .list-pane {
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--raised);
            border-right: 1px solid var(--border)
        }

        .list-controls {
            padding: 16px
        }

        .field-label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-muted)
        }

        .search-wrap {
            position: relative
        }

        .search-wrap input {
            width: 100%;
            height: 32px;
            padding: 0 36px 0 12px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--ink);
            font: inherit
        }

        .search-wrap input::placeholder {
            color: var(--ink-muted)
        }

        .search-wrap kbd {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%)
        }

        kbd {
            display: inline-block;
            min-width: 18px;
            padding: 0 4px;
            border: 1px solid var(--border-strong);
            border-bottom-width: 2px;
            border-radius: var(--radius);
            background: var(--raised);
            font-size: 11px;
            line-height: 16px;
            text-align: center;
            color: var(--ink-muted)
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            min-width: 0;
            margin: 12px 0 0;
            padding: 0;
            border: 0
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 28px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            font-size: 12px;
            color: var(--ink-muted);
            cursor: pointer
        }

        .chip .n {
            font-size: 11px
        }

        .chip:hover:not(:disabled) {
            color: var(--ink);
            border-color: var(--border-strong)
        }

        .chip[aria-pressed="true"] {
            background: var(--selected);
            border-color: var(--border-strong);
            color: var(--ink);
            font-weight: 600
        }

        .chip:disabled {
            opacity: .45;
            cursor: default
        }

        .tree {
            flex: 1;
            overflow: auto;
            padding: 4px 0 16px;
            border-top: 1px solid var(--border)
        }

        .tree-empty {
            padding: 16px;
            color: var(--ink-muted)
        }

        .tree-empty p {
            margin: 0 0 4px
        }

        .dz>summary {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
            cursor: pointer
        }

        .dz>summary::-webkit-details-marker {
            display: none
        }

        .dz>summary::before {
            content: "";
            flex: none;
            width: 0;
            height: 0;
            border-left: 5px solid var(--ink-muted);
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent
        }

        .dz[open]>summary::before {
            transform: rotate(90deg)
        }

        .group>summary {
            height: 32px;
            padding: 0 16px;
            font-size: 12px;
            font-weight: 600
        }

        .group>summary:hover {
            background: var(--sunken)
        }

        .gname {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .gbadge {
            font-size: 11px;
            font-weight: 600;
            color: var(--fail)
        }

        .gcount {
            font-size: 11px;
            font-weight: 400;
            color: var(--ink-muted)
        }

        .items {
            list-style: none;
            margin: 0 0 4px;
            padding: 0
        }

        .item {
            display: grid;
            grid-template-columns: 16px minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
            width: 100%;
            height: 28px;
            padding: 0 16px 0 28px;
            border: 0;
            background: none;
            text-align: left;
            cursor: pointer
        }

        .item .mark {
            justify-self: center
        }

        .item:hover {
            background: var(--sunken)
        }

        .item:focus-visible {
            outline-offset: -2px;
            border-radius: 0
        }

        .item[aria-current="true"] {
            background: var(--selected);
            box-shadow: inset 2px 0 0 var(--accent)
        }

        .item .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .item .dur {
            font-size: 11px;
            color: var(--ink-muted)
        }

        .shortcuts {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            margin: 0;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--ink-muted)
        }

        /* Detail */
        .detail-pane {
            overflow: auto;
            min-width: 0
        }

        .detail {
            container-type: inline-size;
            max-width: 1080px;
            padding: 24px 32px 64px
        }

        .back {
            display: none
        }

        .d-head h2 {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin: 0;
            font-size: 20px;
            line-height: 1.3;
            font-weight: 600;
            letter-spacing: -.01em
        }

        .d-head .mcell {
            height: 26px
        }

        .d-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 16px;
            margin-top: 8px;
            font-size: 12px;
            color: var(--ink-muted)
        }

        .pill {
            display: inline-flex;
            align-items: center;
            height: 20px;
            padding: 0 8px;
            border-radius: 999px;
            background: var(--sunken);
            font-size: 11px;
            font-weight: 500;
            color: var(--ink)
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            margin-top: 8px;
            font-size: 12px;
            color: var(--ink-muted)
        }

        .section {
            margin-top: 32px
        }

        .section>h3 {
            margin: 0 0 12px;
            font-size: 14px;
            font-weight: 600
        }

        .linkbtn {
            padding: 0;
            border: 0;
            background: none;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent-ink);
            cursor: pointer
        }

        .linkbtn:hover {
            text-decoration: underline
        }

        .failure {
            overflow: hidden;
            border: 1px solid var(--border);
            border-top: 2px solid var(--fail);
            border-radius: var(--radius);
            background: var(--raised)
        }

        .failure.is-skip {
            border-top-color: var(--skip)
        }

        .msg {
            padding: 16px
        }

        .exc {
            margin-bottom: 4px;
            font: 600 12px var(--font-mono);
            color: var(--fail)
        }

        .failure.is-skip .exc {
            color: var(--skip)
        }

        .msg pre {
            margin: 0;
            font: 13px/1.6 var(--font-mono);
            white-space: pre-wrap;
            word-break: break-word
        }

        .msg pre.clamp {
            max-height: calc(1.6em * 4);
            overflow: hidden;
            -webkit-mask-image: linear-gradient(#000 60%, transparent);
            mask-image: linear-gradient(#000 60%, transparent)
        }

        .msg .linkbtn {
            margin-top: 8px
        }

        .trace {
            padding: 12px 0;
            border-top: 1px solid var(--border);
            font: 12px/1.7 var(--font-mono)
        }

        .trace-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px 8px;
            font: 12px var(--font-sans);
            color: var(--ink-muted)
        }

        .frame {
            padding: 0 16px 0 32px;
            text-indent: -16px;
            white-space: pre-wrap;
            word-break: break-all
        }

        .frame .at,
        .frame .f-pkg {
            color: var(--ink-muted)
        }

        .frame .f-member {
            font-weight: 500
        }

        .frame .f-loc {
            color: var(--accent-ink)
        }

        .frame.fw,
        .frame.fw * {
            color: var(--ink-muted);
            font-weight: 400
        }

        .frame.cause {
            margin-top: 8px;
            font-weight: 600
        }

        .frames-fw>summary {
            padding: 0 16px;
            font: 12px/28px var(--font-sans);
            color: var(--ink-muted)
        }

        .steps {
            list-style: none;
            margin: 0;
            padding: 0
        }

        .step {
            display: grid;
            grid-template-columns: 16px 48px minmax(0, 1fr) auto;
            gap: 12px;
            align-items: start;
            padding: 6px 12px;
            border-radius: var(--radius)
        }

        .step.is-fail {
            background: var(--selected)
        }

        .step .kw {
            font-weight: 600;
            color: var(--ink-muted)
        }

        .step .arg {
            font: 12px var(--font-mono);
            color: var(--accent-ink)
        }

        .step .dur {
            font-size: 11px;
            line-height: 19.5px;
            color: var(--ink-muted)
        }

        .step-extra {
            grid-column: 3/-1;
            display: grid;
            gap: 8px;
            margin: 8px 0 4px
        }

        .bg>summary {
            height: 28px;
            padding: 0 12px;
            font-size: 12px;
            color: var(--ink-muted)
        }

        .xwrap>summary {
            font: 12px var(--font-mono);
            color: var(--ink-muted)
        }

        .xwrap[open]>summary {
            margin-bottom: 8px
        }

        .dt {
            justify-self: start;
            border-collapse: collapse;
            font: 12px var(--font-mono)
        }

        .dt th,
        .dt td {
            padding: 4px 24px 4px 0;
            text-align: left
        }

        .dt th {
            font: 500 11px var(--font-sans);
            color: var(--ink-muted);
            border-bottom: 1px solid var(--border)
        }

        .xchg {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--raised)
        }

        .xchg+.xchg {
            margin-top: 12px
        }

        .xside {
            min-width: 0;
            padding: 12px 16px
        }

        .xside+.xside {
            border-left: 1px solid var(--border)
        }

        .xlabel {
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-muted)
        }

        .xline {
            font: 12px var(--font-mono);
            word-break: break-all
        }

        .xstatus {
            font-weight: 600
        }

        .xnone {
            margin: 0;
            color: var(--ink-muted)
        }

        .hdrs {
            margin-top: 8px
        }

        .hdrs>summary {
            font-size: 12px;
            color: var(--ink-muted)
        }

        .hdrs dl {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            gap: 4px 12px;
            margin: 8px 0 0;
            font: 11.5px var(--font-mono)
        }

        .hdrs dt {
            color: var(--ink-muted)
        }

        .hdrs dd {
            margin: 0;
            word-break: break-all
        }

        .body {
            max-height: 320px;
            margin: 12px 0 0;
            padding: 12px;
            overflow: auto;
            border-radius: var(--radius);
            background: var(--sunken);
            font: 12px/1.6 var(--font-mono);
            white-space: pre-wrap;
            word-break: break-word
        }

        .xnote {
            margin: 8px 0 0;
            font-size: 11px;
            color: var(--ink-muted)
        }

        @container (max-width:720px) {
            .xchg {
                grid-template-columns: 1fr
            }

            .xside+.xside {
                border-left: 0;
                border-top: 1px solid var(--border)
            }
        }

        .shots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px
        }

        .shot {
            min-width: 0;
            padding: 0;
            border: 0;
            background: none;
            text-align: left;
            cursor: zoom-in
        }

        .shot img {
            display: block;
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--sunken)
        }

        .shot:hover img {
            border-color: var(--border-strong)
        }

        .shot .cap {
            display: block;
            margin-top: 8px;
            overflow: hidden;
            font-size: 12px;
            color: var(--ink-muted);
            white-space: nowrap;
            text-overflow: ellipsis
        }

        .files {
            list-style: none;
            margin: 0;
            padding: 0
        }

        .files li {
            display: flex;
            gap: 16px;
            align-items: baseline;
            padding: 4px 0
        }

        .files a {
            color: var(--accent-ink)
        }

        .kv {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            gap: 8px 32px;
            margin: 0;
            font-size: 13px
        }

        .kv dt {
            color: var(--ink-muted)
        }

        .kv dd {
            margin: 0;
            word-break: break-all
        }

        .kv dd.mono {
            font-size: 12px
        }

        .ov-title {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -.01em
        }

        .ov-sub {
            margin: 4px 0 0;
            color: var(--ink-muted)
        }

        .slow {
            list-style: none;
            max-width: 720px;
            margin: 16px 0 0;
            padding: 0
        }

        .slow .item {
            padding: 0 12px;
            border-radius: var(--radius)
        }

        .slow .suite {
            margin-left: 12px;
            color: var(--ink-muted)
        }

        .empty {
            max-width: 620px;
            padding: 48px 32px
        }

        .empty h2 {
            margin: 0 0 8px;
            font-size: 20px
        }

        .empty p {
            max-width: 65ch;
            margin: 0;
            color: var(--ink-muted)
        }

        .empty code {
            color: var(--ink)
        }

        .lightbox {
            max-width: min(1200px, 94vw);
            max-height: 92dvh;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--raised);
            color: var(--ink)
        }

        .lightbox::backdrop {
            background: rgb(12 14 16 / .74)
        }

        .lb-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 8px 8px 8px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 12px
        }

        .lightbox img {
            display: block;
            max-width: 100%;
            max-height: calc(92dvh - 50px);
            margin: auto
        }

        .print-only {
            display: none
        }

        @media (prefers-reduced-motion:no-preference) {
            .detail.enter {
                animation: pr-in 140ms cubic-bezier(.16, 1, .3, 1)
            }

            .dz>summary::before {
                transition: transform 150ms cubic-bezier(.16, 1, .3, 1)
            }

            .bar {
                transition: opacity 120ms
            }
        }

        @keyframes pr-in {
            from {
                opacity: 0;
                transform: translateY(4px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @media (max-width:767px) {
            .app {
                display: block;
                height: auto
            }

            .topbar {
                padding: 0 16px
            }

            .verdict {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px 16px
            }

            .verdict-title {
                font-size: 32px
            }

            .panes {
                display: block
            }

            .list-pane {
                border-right: 0
            }

            .app[data-view="detail"] .list-pane {
                display: none
            }

            .app[data-view="list"] .detail-pane {
                display: none
            }

            .back {
                display: inline-flex;
                margin-bottom: 16px
            }

            .detail {
                padding: 16px 16px 48px
            }

            .shortcuts {
                display: none
            }

            .step {
                grid-template-columns: 16px minmax(0, 1fr) auto;
                gap: 8px
            }

            .step .kw {
                display: none
            }

            .step-extra {
                grid-column: 2/-1
            }
        }

        @media print {
            .app {
                display: block;
                height: auto
            }

            .actions,
            .pulse,
            .panes {
                display: none
            }

            .topbar,
            .verdict {
                border: 0
            }

            .print-only {
                display: block;
                padding: 0 24px
            }

            .pf {
                margin-top: 24px;
                break-inside: avoid-page
            }

            .pf h3 {
                margin: 0;
                font-size: 14px
            }

            .pf p {
                margin: 4px 0 12px
            }

            .msg pre.clamp {
                max-height: none;
                -webkit-mask-image: none;
                mask-image: none
            }
        }

            function mulberry32(a) {
                return () => {
                    a |= 0; a = a + 0x6D2B79F5 | 0;
                    let t = Math.imul(a ^ a >>> 15, 1 | a);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }
            const rand = mulberry32(20261002);
            const camel = s => s.replace(/[^a-zA-Z0-9 ]/g, ' ').split(' ').filter(Boolean)
                .map((w, i) => i ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w.toLowerCase()).join('');

            function fakeExchange(name) {
                const [method, rawPath] = name.split(' ');
                const path = rawPath.replace('{id}', 'o-20417');

                    if (f.className) { tc.className = f.className; tc.methodName = camel(name); }
                    if (f.steps) {
                        tc.bddType = 'scenario';
                        tc.featureName = suite.name;
                        const split = [0.25, 0.55, 0.2];
                        tc.steps = f.steps.map(([keyword, stepName], j) => ({ keyword, name: stepName, status: 'PASSED', duration: Math.round(duration * split[j]), artifacts: [] }));
                    }
                    if (f.http) tc.artifacts = fakeExchange(name);
                    suite.testCases.splice(Math.floor(rand() * (suite.testCases.length + 1)), 0, tc);
                });
            }

            const demo = new URLSearchParams(location.search).get('state');
            if (demo === 'allpass') for (const s of run.suites) s.testCases = s.testCases.filter(tc => tc.status === 'PASSED');
            if (demo === 'empty') run.suites = [];

            const placeholder = label => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(

            let t = Date.parse(run.startTime);
            const count = (list, s) => list.filter(tc => tc.status === s).length;
            for (const suite of run.suites) {
                suite.startTime = new Date(t).toISOString();
                for (const tc of suite.testCases) {
                    for (const a of [...tc.artifacts, ...tc.steps.flatMap(s => s.artifacts || [])]) {
                        if (a.type === 'screenshot' && !a.content) a.content = placeholder(a.name);
                    }
                    tc.startTime = new Date(t).toISOString();
                    t += tc.duration;
                    tc.endTime = new Date(t).toISOString();
                    t += 40 + Math.round(rand() * 160);
                }
                suite.endTime = new Date(t).toISOString();
                suite.duration = Date.parse(suite.endTime) - Date.parse(suite.startTime);
                Object.assign(suite, { totalTests: suite.testCases.length, passedTests: count(suite.testCases, 'PASSED'), failedTests: count(suite.testCases, 'FAILED'), skippedTests: count(suite.testCases, 'SKIPPED') });
            }
            const all = run.suites.flatMap(s => s.testCases);
            run.endTime = new Date(t).toISOString();
            run.duration = t - Date.parse(run.startTime);
            Object.assign(run, { totalTests: all.length, passedTests: count(all, 'PASSED'), failedTests: count(all, 'FAILED'), skippedTests: count(all, 'SKIPPED') });
            window.PR_RUN = run;
        })();

    <script>
        (() => {
            'use strict';
            const RUN = window.PR_RUN || JSON.parse(document.getElementById('pr-data').textContent);
            const $ = sel => document.querySelector(sel);
            const root = document.documentElement;

            const STATUS = {
                PASSED: { key: 'pass', label: 'Passed' },
                FAILED: { key: 'fail', label: 'Failed' },
                SKIPPED: { key: 'skip', label: 'Skipped' }
            };
            const st = s => STATUS[s] || STATUS.SKIPPED;

            // Every piece of run data reaches the DOM as a text node; nothing is parsed as HTML.
            function h(tag, attrs, ...kids) {
                const el = document.createElement(tag);
                if (attrs) {
                    for (const [k, v] of Object.entries(attrs)) {
                        if (v == null || v === false) continue;
                        if (k === 'class') el.className = v;
                        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
                        else el.setAttribute(k, v === true ? '' : String(v));
                    }
                }
                for (const kid of kids.flat(Infinity)) {
                    if (kid != null && kid !== false) el.append(kid);
                }
                return el;
            }
            const mark = (s, lg) => h('span', { class: `mark${lg ? ' lg' : ''}`, 'data-s': st(s).key, 'aria-hidden': 'true' });
            const markCell = (s, lg) => h('span', { class: 'mcell' }, mark(s, lg));
            const srStatus = s => h('span', { class: 'sr-only' }, `${st(s).label}: `);

            function safeUrl(u) {
                if (!u) return null;
                const s = String(u).trim();
                if (/^data:image\/(png|jpe?g|gif|webp|svg\+xml)[;,]/i.test(s)) return s;
                if (/^(https?|file):/i.test(s)) return s;
                return /^[a-z][a-z0-9+.-]*:/i.test(s) ? null : s;
            }
            function fmtDur(ms) {
                if (ms == null) return '';
                if (ms < 1000) return `${Math.round(ms)}ms`;
                if (ms < 60000) return `${(ms / 1000).toFixed(ms < 10000 ? 1 : 0)}s`;
                const total = Math.round(ms / 1000);
                return `${Math.floor(total / 60)}m ${String(total % 60).padStart(2, '0')}s`;
            }
            function fmtBytes(n) {
                if (n == null) return '';
                const u = ['B', 'KB', 'MB', 'GB'];
                let i = 0;
                while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
                return `${i && n < 10 ? n.toFixed(1) : Math.round(n)} ${u[i]}`;
            }
            function fmtWhen(iso) {
                const d = new Date(iso);
                return isNaN(d) ? '' : d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            }
            const uniq = list => [...new Set(list || [])];

            // ---------- Index ----------
            const tests = [];
            for (const suite of RUN.suites || []) {
                for (const tc of suite.testCases || []) {
                    const hay = [tc.name, suite.name, suite.secondaryText, tc.className, tc.methodName, tc.errorMessage, ...(tc.tags || [])]
                        .filter(Boolean).join('\n').toLowerCase();
                    tests.push({ tc, suite, hay });
                }
            }
            const byId = new Map(tests.map(t => [t.tc.id, t]));
            const timeline = [...tests].sort((a, b) => (Date.parse(a.tc.startTime) || 0) - (Date.parse(b.tc.startTime) || 0));
            const countOf = s => tests.filter(t => t.tc.status === s).length;
            const totals = { all: tests.length, FAILED: countOf('FAILED'), SKIPPED: countOf('SKIPPED'), PASSED: countOf('PASSED') };
            const runDuration = RUN.duration || tests.reduce((sum, t) => sum + (t.tc.duration || 0), 0);

            const state = { selected: null, status: 'all', q: '', rawQ: '' };
            const app = $('#app');
            const search = $('#search');
            const itemEls = new Map();
            const barEls = new Map();
            const groups = [];
            const chipEls = [];
            let emptyEl;

            // ---------- Adapter-aware helpers ----------
            function allArtifacts(tc) {
                return [...(tc.artifacts || []), ...[...(tc.backgroundSteps || []), ...(tc.steps || [])].flatMap(s => s.artifacts || [])];
            }
            // Until the model records the adapter, infer it from what the test captured.
            function adapterOf(tc) {
                if (tc.bddType) return 'Cucumber';
                const arts = allArtifacts(tc);
                if (arts.some(a => a.type === 'http-request' || a.type === 'http-response')) return 'REST-assured';
                if (arts.some(a => a.type === 'screenshot')) return /appium/i.test(tc.className || '') ? 'Appium' : 'Selenium';
                return 'TestNG';
            }
            function locationOf(tc, suite) {
                if (tc.bddType) return suite.secondaryText || tc.featureName || suite.name || '';
                if (tc.className) return tc.className.split('.').pop() + (tc.methodName ? `.${tc.methodName}` : '');
                return suite.secondaryText || suite.name || '';
            }

            // ---------- Verdict + pulse strip ----------
            function renderVerdict() {
                $('#run-name').textContent = RUN.name || 'Test run';
                document.title = `${RUN.name || 'Test run'} - PulseReport`;
                const { all, FAILED: f, SKIPPED: s } = totals;
                const dur = fmtDur(runDuration);
                let title, sub;
                if (!all) { title = 'No tests recorded'; sub = 'The run finished without any test results.'; }
                else if (f) { title = [h('span', { class: 'n-fail' }, String(f)), ' failed']; sub = `of ${all} ${all === 1 ? 'test' : 'tests'} in ${dur}`; }
                else if (s) { title = 'No failures'; sub = `of ${all} tests in ${dur}, ${s} skipped`; }
                else { title = all === 1 ? '1 test passed' : `All ${all} passed`; sub = `in ${dur}`; }

                const left = h('div', null,
                    h('p', { class: 'verdict-title' }, title),
                    h('p', { class: 'verdict-sub' }, sub),
                    renderMeta());
                $('#verdict').replaceChildren(left, ...(all ? [renderPulse()] : []));
            }

            function renderMeta() {
                const entries = Object.entries(RUN.environment || {}).slice(0, 5);
                const started = fmtWhen(RUN.startTime);
                if (started) entries.push(['Started', started]);
                if (!entries.length) return null;
                return h('div', { class: 'run-meta' }, entries.map(([k, v]) => h('span', null, h('span', { class: 'k' }, k), h('span', { class: 'v' }, v))));
            }

            const BAR_AREA = 56;
            const BAR_W = 6;
            function renderPulse() {
                const max = Math.max(1, ...timeline.map(t => t.tc.duration || 0));
                const track = h('div', {
                    class: 'pulse-track', role: 'img',
                    'aria-label': `Run timeline: ${totals.all} tests in execution order, bar height shows duration. ${totals.FAILED} failed, ${totals.SKIPPED} skipped.`
                });
                if (timeline.length > 160) track.style.setProperty('--bar-gap', '1px');
                for (const t of timeline) {
                    const d = t.tc.duration || 0;
                    const bar = h('div', { class: 'bar', 'data-s': st(t.tc.status).key, 'data-id': t.tc.id, title: `${t.tc.name}\n${st(t.tc.status).label}, ${fmtDur(d)}` });
                    // Very short tests collapse to a dot, like the logo.
                    bar.style.height = `${Math.max(BAR_W, Math.round(BAR_AREA * Math.pow(d / max, 0.7)))}px`;
                    barEls.set(t.tc.id, bar);
                    track.append(bar);
                }
                track.addEventListener('click', e => {
                    const bar = e.target.closest('.bar');
                    if (bar) select(bar.dataset.id, { reveal: true });
                });
                const legend = h('div', { class: 'legend', 'aria-hidden': 'true' },
                    ['PASSED', 'FAILED', 'SKIPPED'].filter(k => totals[k]).map(k => h('span', null, mark(k), st(k).label)));
                const pulse = h('div', { class: 'pulse' },
                    h('div', { class: 'pulse-scroll' }, track),
                    h('div', { class: 'pulse-axis' }, h('span', null, 'Run order'), legend, h('span', null, `${fmtDur(runDuration)} total`)));
                pulse.style.maxWidth = `${Math.max(320, timeline.length * 16)}px`;
                return pulse;
            }

            // ---------- Test list ----------
            const CHIPS = [['all', 'All'], ['FAILED', 'Failed'], ['SKIPPED', 'Skipped'], ['PASSED', 'Passed']];
            function renderChips() {
                for (const [key, label] of CHIPS) {
                    const n = key === 'all' ? totals.all : totals[key];
                    const chip = h('button', { type: 'button', class: 'chip', 'data-status': key, 'aria-pressed': 'false', disabled: key !== 'all' && n === 0 },
                        label, h('span', { class: 'n' }, String(n)));
                    chip.addEventListener('click', () => { state.status = key; applyFilter(); });
                    chipEls.push(chip);
                }
                $('#chips').append(...chipEls);
            }

            function renderTree() {
                const nodes = [];
                for (const suite of RUN.suites || []) {
                    const cases = suite.testCases || [];
                    if (!cases.length) continue;
                    const failed = cases.filter(c => c.status === 'FAILED').length;
                    const ul = h('ul', { class: 'items' });
                    const det = h('details', { class: 'group dz', open: failed > 0 },
                        h('summary', { title: suite.secondaryText || suite.name || '' },
                            h('span', { class: 'gname' }, suite.name || suite.secondaryText || 'Unnamed suite'),
                            failed ? h('span', { class: 'gbadge' }, `${failed} failed`) : h('span', { class: 'gcount' }, String(cases.length))),
                        ul);
                    for (const tc of cases) {
                        const btn = h('button', { type: 'button', class: 'item', 'data-id': tc.id },
                            mark(tc.status), h('span', { class: 'name' }, srStatus(tc.status), tc.name), h('span', { class: 'dur' }, fmtDur(tc.duration)));
                        btn.addEventListener('click', () => select(tc.id));
                        const li = h('li', null, btn);
                        ul.append(li);
                        itemEls.set(tc.id, { li, btn, det, entry: byId.get(tc.id) });
                    }
                    groups.push(det);
                    nodes.push(det);
                }
                emptyEl = h('div', { class: 'tree-empty', hidden: true });
                $('#tree').replaceChildren(...nodes, emptyEl);
            }

            function matches(t) {
                if (state.status !== 'all' && t.tc.status !== state.status) return false;
                return !state.q || t.hay.includes(state.q);
            }

            function applyFilter() {
                const filtering = state.status !== 'all' || state.q;
                const hits = new Set();
                let any = 0;
                for (const it of itemEls.values()) {
                    const ok = matches(it.entry);
                    it.li.hidden = !ok;
                    if (ok) { any++; hits.add(it.det); }
                }
                for (const det of groups) {
                    det.hidden = !hits.has(det);
                    if (filtering && hits.has(det)) det.open = true;
                }
                for (const chip of chipEls) chip.setAttribute('aria-pressed', String(chip.dataset.status === state.status));
                emptyEl.hidden = any > 0;
                if (!any) {
                    const what = state.status === 'all' ? 'tests' : `${st(state.status).label.toLowerCase()} tests`;
                    emptyEl.replaceChildren(
                        h('p', null, state.q ? `No ${what} match “${state.rawQ}”.` : `No ${what} in this run.`),
                        h('button', { type: 'button', class: 'linkbtn', onclick: clearFilters }, 'Clear filters'));
                }
            }
            function clearFilters() {
                state.status = 'all'; state.q = ''; state.rawQ = ''; search.value = '';
                applyFilter();
            }
            search.addEventListener('input', () => {
                state.rawQ = search.value.trim();
                state.q = state.rawQ.toLowerCase();
                applyFilter();
            });

            // ---------- Selection ----------
            function select(id, opts = {}) {
                const entry = byId.get(id);
                if (!entry) return;
                if (state.selected) {
                    itemEls.get(state.selected)?.btn.removeAttribute('aria-current');
                    barEls.get(state.selected)?.removeAttribute('aria-current');
                }
                state.selected = id;
                const it = itemEls.get(id);
                if (it) {
                    it.btn.setAttribute('aria-current', 'true');
                    if (opts.reveal) {
                        if (it.li.hidden) clearFilters();
                        it.det.open = true;
                        it.btn.scrollIntoView({ block: 'nearest' });
                    }
                }
                barEls.get(id)?.setAttribute('aria-current', 'true');
                renderDetail(entry);
                if (!opts.initial) {
                    try { history.replaceState(null, '', `#t=${encodeURIComponent(id)}`); } catch { /* file:// in some browsers */ }
                    app.dataset.view = 'detail';
                    if (matchMedia('(max-width: 767px)').matches) $('#detail').scrollIntoView();
                }
            }
            function idFromHash() {
                const m = location.hash.match(/^#t=(.+)$/);
                if (!m) return null;
                try { return decodeURIComponent(m[1]); } catch { return null; }
            }

            // ---------- Detail ----------
            const section = (title, ...kids) => h('section', { class: 'section' }, h('h3', null, title), ...kids);

            function renderDetail({ tc, suite }) {
                const d = h('div', { class: 'detail enter' });
                d.append(h('button', {
                    type: 'button', class: 'btn back',
                    onclick: () => { app.dataset.view = 'list'; itemEls.get(tc.id)?.btn.focus(); }
                }, '← All tests'));
                d.append(renderHead(tc, suite));

                const failure = renderFailure(tc);
                if (failure) d.append(section(tc.status === 'SKIPPED' ? 'Skip reason' : 'Failure', failure));
                const steps = renderSteps(tc);
                if (steps) d.append(section('Steps', steps));
                const arts = tc.artifacts || [];
                const exchanges = pairExchanges(arts);
                if (exchanges.length) d.append(section(exchanges.length > 1 ? 'HTTP exchanges' : 'HTTP exchange', exchanges.map(exchangeEl)));
                const shots = renderShots(arts);
                if (shots) d.append(section('Screenshots', shots));
                const files = renderFiles(arts);
                if (files) d.append(section('Attachments', files));
                d.append(section('Details', renderKv(tc, suite)));

                const pane = $('#detail');
                pane.replaceChildren(d);
                pane.scrollTop = 0;
            }

            function renderHead(tc, suite) {
                const s = st(tc.status);
                const tags = uniq(tc.tags);
                return h('header', { class: 'd-head' },
                    h('h2', null, markCell(tc.status, true), h('span', null, h('span', { class: 'sr-only' }, `${s.label}: `), tc.name)),
                    h('div', { class: 'd-meta' },
                        h('span', { class: 'pill' }, adapterOf(tc)),
                        h('span', null, locationOf(tc, suite)),
                        h('span', null, fmtDur(tc.duration)),
                        tc.retryCount ? h('span', null, `Retried ${tc.retryCount}×`) : null),
                    tags.length ? h('div', { class: 'tags' }, tags.map(t => h('span', null, t))) : null);
            }

            // ---------- Failure + stack trace ----------
            const FRAMEWORK = /^(?:java\.base\/|java\.|javax\.|jdk\.|sun\.|com\.sun\.|org\.testng\.|org\.junit\.|junit\.|org\.opentest4j\.|io\.cucumber\.|org\.codehaus\.groovy\.|groovy\.|io\.restassured\.internal\.|org\.apache\.|org\.openqa\.selenium\.support\.ui\.|org\.openqa\.selenium\.remote\.|io\.appium\.java_client\.|org\.gradle\.|org\.springframework\.)/;
            const isFramework = f => FRAMEWORK.test(f) || /^\.\.\. \d+ more$/.test(f);

            function parseTrace(raw) {
                const head = [], frames = [];
                for (const line of raw.split('\n')) {
                    const m = line.match(/^\s*at\s+(.+)$/);
                    if (m) frames.push(m[1].trim());
                    else if (!frames.length) head.push(line);
                    else if (line.trim()) frames.push(line.trim());
                }
                return { head, frames };
            }
            function exceptionName(line) {
                const m = (line || '').match(/^([\w$.]+(?:Exception|Error|Throwable))\b/);
                return m ? m[1].split('.').pop() : '';
            }
            // pkg.Class.method(File.java:88) -> muted package, emphasised Class.method, accent File.java:88
            function frameParts(f) {
                const m = f.match(/^(.*)\(([^()]*)\)$/);
                if (!m) return [f];
                const [, callee, loc] = m;
                let pkg = '', member = callee;
                if (!callee.startsWith('✽')) {
                    const parts = callee.split('.');
                    if (parts.length > 2) { pkg = parts.slice(0, -2).join('.') + '.'; member = parts.slice(-2).join('.'); }
                }
                return [h('span', { class: 'f-pkg' }, pkg), h('span', { class: 'f-member' }, member), '(', h('span', { class: 'f-loc', title: loc }, loc.split('/').pop()), ')'];
            }

            function renderFailure(tc, { open = false } = {}) {
                if (tc.status === 'PASSED' || (!tc.errorMessage && !tc.stackTrace)) return null;
                const { head, frames } = parseTrace(tc.stackTrace || '');
                const message = (tc.errorMessage || head.join('\n')).trim();
                const exc = exceptionName(head[0]);
                const pre = h('pre', null, message);
                const box = h('div', { class: 'msg' }, exc ? h('div', { class: 'exc' }, exc) : null, pre);
                if (!open && (message.split('\n').length > 4 || message.length > 420)) {
                    pre.classList.add('clamp');
                    const more = h('button', { type: 'button', class: 'linkbtn' }, 'Show full message');
                    more.addEventListener('click', () => {
                        more.textContent = pre.classList.toggle('clamp') ? 'Show full message' : 'Show less';
                    });
                    box.append(more);
                }
                const panel = h('div', { class: `failure${tc.status === 'SKIPPED' ? ' is-skip' : ''}` }, box);
                if (frames.length) panel.append(renderTrace(tc.stackTrace, frames, open));
                return panel;
            }

            function renderTrace(raw, frames, open) {
                const copy = h('button', { type: 'button', class: 'linkbtn' }, 'Copy trace');
                copy.addEventListener('click', async () => {
                    try { await navigator.clipboard.writeText(raw); copy.textContent = 'Copied'; }
                    catch { copy.textContent = 'Copy not allowed here'; }
                    setTimeout(() => { copy.textContent = 'Copy trace'; }, 1600);
                });
                const wrap = h('div', { class: 'trace' }, h('div', { class: 'trace-head' }, h('span', null, `Stack trace, ${frames.length} frames`), copy));
                const frameEl = (f, fw) => {
                    const cls = `frame${fw ? ' fw' : ''}${/^Caused by:/.test(f) ? ' cause' : ''}`;
                    if (/^(Caused by:|\.\.\.)/.test(f)) return h('div', { class: cls }, f);
                    return h('div', { class: cls }, h('span', { class: 'at' }, 'at '), frameParts(f));
                };
                let buf = [];
                const flush = () => {
                    if (buf.length === 1) wrap.append(frameEl(buf[0], true));
                    else if (buf.length) wrap.append(h('details', { class: 'dz frames-fw', open }, h('summary', null, `${buf.length} framework frames`), buf.map(f => frameEl(f, true))));
                    buf = [];
                };
                for (const f of frames) {
                    if (isFramework(f)) buf.push(f);
                    else { flush(); wrap.append(frameEl(f, false)); }
                }
                flush();
                return wrap;
            }

            // ---------- Steps ----------
            function renderSteps(tc) {
                const bg = tc.backgroundSteps || [], steps = tc.steps || [];
                if (!bg.length && !steps.length) return null;
                const expandHttp = tc.status === 'FAILED';
                const out = [];
                if (bg.length) {
                    const bgOk = bg.every(s => s.status === 'PASSED');
                    const label = `Background, ${bg.length} ${bg.length === 1 ? 'step' : 'steps'}${bgOk ? ' passed' : ''}`;
                    out.push(h('details', { class: 'dz bg', open: !bgOk }, h('summary', null, label), h('ol', { class: 'steps' }, bg.map(s => stepEl(s, expandHttp)))));
                }
                if (steps.length) out.push(h('ol', { class: 'steps' }, steps.map(s => stepEl(s, expandHttp))));
                return out;
            }

            function stepText(text) {
                return text.split(/("[^"]*")/).filter(Boolean)
                    .map(part => part.length > 1 && part.startsWith('"') && part.endsWith('"') ? h('span', { class: 'arg' }, part) : part);
            }

            function stepEl(s, expandHttp) {
                const failed = s.status === 'FAILED';
                const li = h('li', { class: `step${failed ? ' is-fail' : ''}` },
                    markCell(s.status),
                    h('span', { class: 'kw' }, s.keyword || ''),
                    h('span', null, srStatus(s.status), stepText(s.name || '')),
                    h('span', { class: 'dur' }, s.duration ? fmtDur(s.duration) : ''));
                const extra = [];
                if (s.dataTable?.length) extra.push(dataTable(s.dataTable));
                if (s.docString) extra.push(h('pre', { class: 'body' }, s.docString));
                for (const pair of pairExchanges(s.artifacts || [])) {
                    extra.push(h('details', { class: 'dz xwrap', open: expandHttp || failed }, h('summary', null, exchangeTitle(pair)), exchangeEl(pair)));
                }
                const shots = renderShots(s.artifacts || []);
                if (shots) extra.push(shots);
                if (extra.length) li.append(h('div', { class: 'step-extra' }, extra));
                return li;
            }

            function dataTable(rows) {
                const [head, ...body] = rows;
                return h('table', { class: 'dt' },
                    h('thead', null, h('tr', null, head.map(c => h('th', { scope: 'col' }, c)))),
                    h('tbody', null, body.map(r => h('tr', null, r.map(c => h('td', null, c))))));
            }

            // ---------- HTTP ----------
            const REASONS = { 200: 'OK', 201: 'Created', 202: 'Accepted', 204: 'No Content', 301: 'Moved Permanently', 302: 'Found', 304: 'Not Modified', 400: 'Bad Request', 401: 'Unauthorized', 403: 'Forbidden', 404: 'Not Found', 409: 'Conflict', 422: 'Unprocessable Content', 429: 'Too Many Requests', 500: 'Internal Server Error', 502: 'Bad Gateway', 503: 'Service Unavailable', 504: 'Gateway Timeout' };

            function parseHttp(content) {
                const out = { line: '', headers: [], body: '', note: '' };
                const hi = content.indexOf('\n\nHeaders:\n');
                const bi = content.indexOf('\n\nBody:\n');
                out.line = content.slice(0, hi >= 0 ? hi : bi >= 0 ? bi : content.length).trim();
                if (hi >= 0) {
                    out.headers = content.slice(hi + 11, bi >= 0 ? bi : content.length).split('\n').filter(Boolean).map(l => {
                        const i = l.indexOf(':');
                        return i > 0 ? [l.slice(0, i), l.slice(i + 1).trim()] : [l, ''];
                    });
                }
                if (bi >= 0) {
                    let body = content.slice(bi + 8);
                    const cut = body.match(/\n*\[(Content truncated[^\]]*)\]\s*$/);
                    if (cut) { out.note = cut[1]; body = body.slice(0, cut.index); }
                    out.body = body.trim();
                }
                return out;
            }
            function pairExchanges(arts) {
                const out = [];
                let cur = null;
                for (const a of arts) {
                    if (a.type === 'http-request') { cur = { req: parseHttp(a.content || ''), res: null }; out.push(cur); }
                    else if (a.type === 'http-response') {
                        if (cur && !cur.res) cur.res = parseHttp(a.content || '');
                        else out.push({ req: null, res: parseHttp(a.content || '') });
                    }
                }
                return out;
            }
            const statusCode = res => +((res.line.match(/\b\d{3}\b/) || [])[0] || 0);
            function exchangeTitle({ req, res }) {
                let title = 'HTTP';
                if (req) {
                    const [method, url] = req.line.split(/\s+/);
                    let path = url || '';
                    try { path = new URL(url).pathname; } catch { /* keep raw */ }
                    title = `${method} ${path}`;
                }
                if (res) title += ` → ${statusCode(res) || res.line}`;
                else if (req) title += ' → no response';
                return title;
            }
            function prettyBody(body) {
                try { return JSON.stringify(JSON.parse(body), null, 2); } catch { return body; }
            }
            function httpSide(label, p, isResponse) {
                if (!p) return h('div', { class: 'xside' }, h('div', { class: 'xlabel' }, label), h('p', { class: 'xnone' }, isResponse ? 'No response received.' : 'Request was not captured.'));
                let line;
                if (isResponse) {
                    const code = statusCode(p);
                    const cls = code >= 400 ? 's-fail' : code >= 200 && code < 300 ? 's-pass' : '';
                    line = h('div', { class: `xline xstatus ${cls}` }, code ? `${code} ${REASONS[code] || ''}`.trim() : p.line);
                } else {
                    line = h('div', { class: 'xline' }, p.line);
                }
                return h('div', { class: 'xside' },
                    h('div', { class: 'xlabel' }, label), line,
                    p.headers.length ? h('details', { class: 'dz hdrs' }, h('summary', null, `Headers (${p.headers.length})`), h('dl', null, p.headers.flatMap(([k, v]) => [h('dt', null, k), h('dd', null, v)]))) : null,
                    p.body ? h('pre', { class: 'body' }, prettyBody(p.body)) : null,
                    p.note ? h('p', { class: 'xnote' }, p.note) : null);
            }
            const exchangeEl = pair => h('div', { class: 'xchg' }, httpSide('Request', pair.req, false), httpSide('Response', pair.res, true));

            // ---------- Artifacts ----------
            const isImage = a => a.type === 'screenshot' || /^image\//.test(a.mimeType || '');
            function renderShots(arts) {
                const shots = arts.filter(isImage);
                if (!shots.length) return null;
                return h('div', { class: 'shots' }, shots.map(a => {
                    const src = safeUrl(a.content && a.content.startsWith('data:') ? a.content : a.path);
                    const btn = h('button', { type: 'button', class: 'shot', 'aria-label': `Open screenshot ${a.name || ''}`.trim() },
                        src ? h('img', { src, alt: a.name || 'Screenshot', loading: 'lazy' }) : h('span', { class: 'muted' }, 'Image not embedded'),
                        h('span', { class: 'cap' }, a.name || 'screenshot'));
                    if (src) btn.addEventListener('click', () => openLightbox(src, a.name));
                    return btn;
                }));
            }
            function renderFiles(arts) {
                const files = arts.filter(a => !isImage(a) && a.type !== 'http-request' && a.type !== 'http-response');
                if (!files.length) return null;
                return h('ul', { class: 'files' }, files.map(a => {
                    const href = safeUrl(a.path);
                    return h('li', null,
                        href ? h('a', { href }, a.name || a.path) : h('span', null, a.name || ''),
                        h('span', { class: 'muted' }, fmtBytes(a.size)));
                }));
            }
            function renderKv(tc, suite) {
                const rows = [];
                if (tc.bddType) rows.push(['Feature', tc.featureName || suite.name], ['Type', tc.bddType.replace(/_/g, ' ')]);
                if (tc.className) rows.push(['Class', tc.className, true]);
                if (tc.methodName) rows.push(['Method', tc.methodName, true]);
                if (tc.startTime) rows.push(['Started', new Date(tc.startTime).toLocaleString()]);
                rows.push(['Duration', fmtDur(tc.duration)]);
                if (tc.retryCount) rows.push(['Retries', String(tc.retryCount)]);
                for (const m of tc.metrics || []) rows.push([m.name, `${m.value} ${m.unit || ''}`.trim()]);
                return h('dl', { class: 'kv' }, rows.flatMap(([k, v, code]) => [h('dt', null, k), h('dd', { class: code ? 'mono' : null }, v)]));
            }

            // ---------- Overview / empty ----------
            function renderOverview() {
                const pane = $('#detail');
                if (!tests.length) {
                    pane.replaceChildren(h('div', { class: 'empty' },
                        h('h2', null, 'No test results were recorded'),
                        h('p', null, 'PulseReport finished without receiving any results. Check that an adapter is registered, for example ',
                            h('code', null, 'TestNGAdapter'), ' as a listener in ', h('code', null, 'testng.xml'), ', and that ',
                            h('code', null, 'reporter.output.formats'), ' includes ', h('code', null, 'html'), '.')));
                    return;
                }
                const slow = [...tests].sort((a, b) => (b.tc.duration || 0) - (a.tc.duration || 0)).slice(0, 5);
                pane.replaceChildren(h('div', { class: 'detail enter' },
                    h('h2', { class: 'ov-title' }, 'Slowest tests'),
                    h('p', { class: 'ov-sub' }, 'Nothing failed in this run. These five tests took the longest.'),
                    h('ol', { class: 'slow' }, slow.map(t => h('li', null,
                        h('button', { type: 'button', class: 'item', onclick: () => select(t.tc.id, { reveal: true }) },
                            mark(t.tc.status),
                            h('span', { class: 'name' }, t.tc.name, h('span', { class: 'suite' }, t.suite.name)),
                            h('span', { class: 'dur' }, fmtDur(t.tc.duration))))))));
            }

            // ---------- Lightbox ----------
            const lightbox = $('#lightbox');
            function openLightbox(src, name) {
                const img = $('#lb-img');
                img.src = src;
                img.alt = name || 'Screenshot';
                $('#lb-name').textContent = name || '';
                lightbox.showModal();
            }
            lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.close(); });
            $('#lb-close').addEventListener('click', () => lightbox.close());

            // ---------- Theme + download ----------
            const THEMES = ['auto', 'light', 'dark'];
            const THEME_ICON = { auto: 'i-auto', light: 'i-sun', dark: 'i-moon' };
            const themeBtn = $('#theme-btn');
            function setTheme(t) {
                root.dataset.theme = t;
                themeBtn.querySelector('use').setAttribute('href', `#${THEME_ICON[t]}`);
                const label = `Theme: ${t[0].toUpperCase()}${t.slice(1)}. Click to change.`;
                themeBtn.setAttribute('aria-label', label);
                themeBtn.title = label;
                try { localStorage.setItem('pr-theme', t); } catch { /* storage unavailable */ }
            }
            setTheme(THEMES.includes(root.dataset.theme) ? root.dataset.theme : 'auto');
            themeBtn.addEventListener('click', () => setTheme(THEMES[(THEMES.indexOf(root.dataset.theme) + 1) % THEMES.length]));

            $('#download-btn').addEventListener('click', () => {
                const url = URL.createObjectURL(new Blob([JSON.stringify(RUN, null, 2)], { type: 'application/json' }));
                const a = h('a', { href: url, download: 'test-report.json' });
                document.body.append(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            });

            // ---------- Keyboard ----------
            function move(dir) {
                const visible = [...itemEls.values()].filter(it => !it.li.hidden && !it.det.hidden);
                if (!visible.length) return;
                let i = visible.findIndex(it => it.btn.dataset.id === state.selected);
                i = i < 0 ? (dir > 0 ? 0 : visible.length - 1) : Math.min(visible.length - 1, Math.max(0, i + dir));
                const it = visible[i];
                it.det.open = true;
                select(it.btn.dataset.id);
                it.btn.scrollIntoView({ block: 'nearest' });
            }
            document.addEventListener('keydown', e => {
                if (lightbox.open) {
                    if (e.key === 'Escape') { e.preventDefault(); lightbox.close(); }
                    return;
                }
                if (e.metaKey || e.ctrlKey || e.altKey) return;
                const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
                if (typing) {
                    if (e.key === 'Escape' && document.activeElement === search) {
                        if (search.value) { search.value = ''; search.dispatchEvent(new Event('input')); } else search.blur();
                    }
                    return;
                }
                if (e.key === '/') { e.preventDefault(); search.focus(); search.select(); }
                else if (e.key === 'j' || e.key === 'k') { e.preventDefault(); move(e.key === 'j' ? 1 : -1); }
                else if (e.key === 'f' && totals.FAILED) { state.status = state.status === 'FAILED' ? 'all' : 'FAILED'; applyFilter(); }
            });
            window.addEventListener('hashchange', () => {
                const id = idFromHash();
                if (id && id !== state.selected) select(id, { reveal: true });
            });

            // ---------- Print: every failure with its full trace ----------
            window.addEventListener('beforeprint', () => {
                const failed = timeline.filter(t => t.tc.status === 'FAILED');
                $('#print-failures').replaceChildren(
                    ...(failed.length ? [h('h2', null, 'Failures')] : []),
                    ...failed.map(t => h('section', { class: 'pf' },
                        h('h3', null, t.tc.name),
                        h('p', { class: 'muted' }, `${locationOf(t.tc, t.suite)}  ${fmtDur(t.tc.duration)}`),
                        renderFailure(t.tc, { open: true }))));
            });

            // ---------- Boot ----------
            renderVerdict();
            renderChips();
            renderTree();
            applyFilter();
            if (!tests.length) app.classList.add('is-empty');
            const fromHash = idFromHash();
            const initial = fromHash && byId.has(fromHash) ? fromHash : timeline.find(t => t.tc.status === 'FAILED')?.tc.id;
            if (initial) select(initial, { reveal: true, initial: !fromHash });
            else renderOverview();
        })();
    </script>
</body>

</html>
